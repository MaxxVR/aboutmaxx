<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Climb</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f4f4f4;
    }

    img {
      width: 1000px;
      height: 500px;
      object-fit: contain;
    }

    h1 {
      margin: 20px 0;
      font-size: 2rem;
      color: #333;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <img src="Climb.png" alt="Climb Logo">
  <h1>Climb</h1>
  <a href="privacy.html">
    <button>Privacy Policy</button>
  </a>

</body>
</html>
